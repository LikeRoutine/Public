name: Format Routing Rules

# 触发条件：每天凌晨 0 点自动运行，或者在 Actions 页面手动点击触发
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

# ====== 关键修改：赋予工作流写入仓库的权限 ======
permissions:
  contents: write
# ============================================

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Process Proxy List
        run: |
          if curl -f -sSL https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/proxy-list.txt -o tmp_proxy.txt && [ -s tmp_proxy.txt ]; then
            echo "Proxy 源文件下载成功且不为空，开始转换..."
            grep -v -E '^(regexp:|full:|#)' tmp_proxy.txt | grep -v '^$' | sed 's/^/DOMAIN-SUFFIX,/;s/$/,Global/' > proxy.list
            rm tmp_proxy.txt
          else
            echo "警告：Proxy 源文件下载失败或内容为空！跳过本次更新，保持原文件不变。"
            [ -f tmp_proxy.txt ] && rm tmp_proxy.txt
          fi

      - name: Process Direct List
        run: |
          if curl -f -sSL https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/direct-list.txt -o tmp_direct.txt && [ -s tmp_direct.txt ]; then
            echo "Direct 源文件下载成功且不为空，开始转换..."
            grep -v -E '^(regexp:|full:|#)' tmp_direct.txt | grep -v '^$' | grep -v '^cn$' | sed 's/^/DOMAIN-SUFFIX,/;s/$/,DIRECT/' > direct.list
            rm tmp_direct.txt
          else
            echo "警告：Direct 源文件下载失败或内容为空！跳过本次更新，保持原文件不变。"
            [ -f tmp_direct.txt ] && rm tmp_direct.txt
          fi

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add proxy.list direct.list
          if ! git diff --cached --quiet; then
            git commit -m "自动更新路由规则列表 ($(date +'%Y-%m-%d %H:%M:%S'))"
            git push
          else
            echo "没有检测到内容变化或下载已跳过，无需提交。"
          fi
